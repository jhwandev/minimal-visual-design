<article class="prose"><p class="eyebrow">Design note</p><h3>좋은 구조는 읽는 순서를 만든다</h3><p>정보를 시각화한다는 것은 모든 문장을 그림으로 바꾸는 일이 아닙니다. 독자가 무엇을 비교하고 어떤 순서를 이해해야 하는지 먼저 판단하는 일입니다.</p><blockquote class="quote">형식은 질문을 따라갑니다.</blockquote><p>정확한 값은 표에서 읽고, 시간의 흐름은 타임라인에서 봅니다. 본문의 논리가 중요할 때는 충분한 너비와 줄 간격을 갖춘 문단이 더 자연스럽습니다.</p></article>
