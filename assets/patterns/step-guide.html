<ol class="step-guide"><li><div><h3>자료 모으기</h3><p>핵심 질문에 답하는 자료와 출처를 한곳에 모읍니다. 완료 기준: 날짜와 단위가 확인된 자료 목록.</p></div></li><li><div><h3>구조 고르기</h3><p>비교, 흐름, 관계, 데이터 중 중심 구조를 고릅니다. 완료 기준: 독자가 읽을 순서를 설명할 수 있음.</p></div></li><li><div><h3>확인하고 공유하기</h3><p>모바일과 키보드로 내용을 확인합니다. 완료 기준: 누락이나 잘린 문장 없이 모든 정보에 접근 가능.</p></div></li></ol>
